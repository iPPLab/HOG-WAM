# Example user configuration for the official 50-task v6e-64 run.
# Change every GCS path explicitly when moving data or outputs to another owner/bucket.
paths:
  read:
    video_dit_orbax: "gs://your-bucket/inputs/ckpt/wan22_5b/transformer"
    vae_orbax: "gs://your-bucket/inputs/ckpt/wan22_5b/vae"
    action_dit_init: "gs://your-bucket/inputs/fastwam_tpu/ckpt/action_dit_init_1024"
    training_data: "gs://your-bucket/inputs/data/train/pixel_v3"
    dataset_stats: "gs://your-bucket/inputs/fastwam_tpu/official_ckpt/robotwin_uncond_3cam_384_dataset_stats.json"
    text_embeddings: "gs://your-bucket/inputs/fastwam_tpu/data/robotwin_uncond_3cam_384/text/umt5xxl_L128_fastwam_tmpl_wan21"
  write:
    runs: "gs://your-bucket/fastwam_tpu/runs"
    jax_cache: "gs://your-bucket/fastwam_tpu/jax_cache_v6e_fastwam_hog"
    code_packages: "gs://your-bucket/fastwam_tpu/code"

# TPU zone must be in the same GCS zone.
tpu:
  zone: "us-east1-d"
  accelerator: "v6e-64"
  runtime_version: "v6e-ubuntu-2404"

data:
  task_filter: null

# Action flow-time sampling. Keep the defaults for the released single-copy recipe.
flow:
  tau_copies: 1
  copy_lengths: null

training:
  learning_rate: 1.0e-4
  weight_decay: 1.0e-2
  num_epochs: 5
  steps: null
  decay_steps: null
  global_batch_size: 1024
  micro_batch_size: 1024
  checkpoint:
    full_every: 2500
    bf16_every: 2500
